#:schema node_modules/wrangler/config-schema.json
name = "website-akpro-complete-remaster"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# Point to the processed output from next-on-pages
pages_build_output_dir = ".vercel/output/static"

[vars]
# You will need to set these in the Cloudflare Dashboard 
# or via `wrangler pages secret put`
# TURSO_DATABASE_URL = ""
# TURSO_AUTH_TOKEN = ""
# JWT_SECRET = ""
